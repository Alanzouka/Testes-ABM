<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Feedback</title>
</head>
<body>

    <form id="formFeedback">
        <textarea id="feedbackTexto" name="feedbackTexto" rows="4" cols="40" placeholder="Fala o que você achar..."></textarea>
        <input type="email" id="feedbackEmail" placeholder="Seu e-mail (opcional)">
        <button type="submit">Enviar Feedback</button>
    </form>

    <div id="resultadoFeedback"></div>

    <script src="feedback.js"></script>
</body>
</html>
